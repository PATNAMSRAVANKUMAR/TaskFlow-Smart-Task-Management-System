<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="head-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="50" cy="50" r="48" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Robot Head / Body Base -->
  <!-- Headset band -->
  <path d="M 22 50 C 22 30 35 22 50 22 C 65 22 78 30 78 50" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  
  <!-- Headset Earcups with Cyan Glow -->
  <!-- Left earpiece -->
  <rect x="16" y="44" width="8" height="18" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="18" y="48" width="4" height="10" rx="2" fill="url(#cyan-glow)" filter="url(#glow)" />
  <!-- Right earpiece -->
  <rect x="76" y="44" width="8" height="18" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="78" y="48" width="4" height="10" rx="2" fill="url(#cyan-glow)" filter="url(#glow)" />

  <!-- Antenna top node -->
  <path d="M 50 22 L 50 14" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="13" r="3.5" fill="url(#cyan-glow)" filter="url(#glow)" />

  <!-- Main Head Shape -->
  <rect x="25" y="32" width="50" height="42" rx="16" fill="url(#head-metal)" />
  
  <!-- Visor / Face Screen -->
  <rect x="29" y="38" width="42" height="26" rx="10" fill="url(#visor-grad)" stroke="#334155" stroke-width="1" />
  
  <!-- Glowing Cyan Cyber Eyes (Friendly Curved Style) -->
  <path d="M 37 49 Q 42 43 47 49" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 53 49 Q 58 43 63 49" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Cheerful digital blush dots -->
  <circle cx="36" cy="56" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="64" cy="56" r="1.5" fill="#38bdf8" opacity="0.7" />

  <!-- Digital smile -->
  <path d="M 46 56 Q 50 59 54 56" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Neck & Shoulder Plate -->
  <path d="M 39 74 L 61 74 L 67 86 L 33 86 Z" fill="#475569" />
  <path d="M 44 74 L 56 74 L 58 80 L 42 80 Z" fill="url(#cyan-glow)" opacity="0.8" />
  <circle cx="50" cy="83" r="1.5" fill="#ffffff" />
</svg>
